<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:;" />
<title>Omniscient Launcher</title>
<style>
  :root {
    /* Bleu nuit + turquoise (au lieu du violet) : fond profond, lueurs et
       liens en turquoise, et un vert emeraude dedie a "jouer"/"en ligne"
       (convention universelle des launchers de jeu — Lunar Client par ex. —
       et coherent avec le point vert de statut deja utilise ailleurs). */
    --background: #070c16;
    --surface: #0f1729;
    --surface-raised: #16213a;
    --border: #223252;
    --foreground: #e8edf7;
    --muted: #8ea0bd;
    --accent: #22d3ee;
    --accent-hover: #5ee2f5;
    --accent-foreground: #052029;
    --accent-2: #2dd88a;
    --gradient-brand: linear-gradient(135deg, var(--accent), var(--accent-2));
    --danger: #ff6b81;
    --success: #2dd88a;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  body {
    margin: 0;
    background: var(--background);
    color: var(--foreground);
    font-family: "Segoe UI", Arial, Helvetica, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Barre de titre custom : la fenêtre est créée avec frame:false (voir
     main.js) pour éviter le mélange "chrome Windows générique au-dessus
     d'une interface custom" — la convention de tous les launchers de jeu
     sérieux (Lunar Client, Modrinth App...) est de dessiner sa propre barre
     avec ses propres boutons. -webkit-app-region:drag permet de déplacer la
     fenêtre en cliquant cette zone ; les boutons doivent explicitement
     repasser en no-drag sinon leurs clics sont interceptés par le drag. */
  #titlebar {
    display: flex;
    align-items: center;
    height: 36px;
    flex: 0 0 auto;
    background: rgba(15, 23, 41, 0.92);
    border-bottom: 1px solid var(--border);
    -webkit-app-region: drag;
    padding-left: 12px;
  }
  #titlebar-drag { display: flex; align-items: center; gap: 8px; flex: 1 1 auto; min-width: 0; }
  #titlebar .logo { font-size: 13px; }
  #titlebar-controls { display: flex; height: 100%; -webkit-app-region: no-drag; }
  .titlebar-btn {
    width: 44px;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
  }
  .titlebar-btn svg { width: 10px; height: 10px; }
  .titlebar-btn:hover { background: var(--surface-raised); color: var(--foreground); }
  .titlebar-btn-close:hover { background: var(--danger); color: #fff; }

  /* Barre latérale minimale : navigation serveurs/paramètres, convention
     quasi universelle des launchers du genre plutôt qu'un simple header. */
  #sidebar {
    flex: 0 0 auto;
    width: 56px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 14px 0;
    border-right: 1px solid var(--border);
    background: rgba(15, 23, 41, 0.5);
  }
  .sidebar-btn {
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    border: none;
    background: none;
    color: var(--muted);
    cursor: pointer;
  }
  .sidebar-btn svg { width: 20px; height: 20px; }
  .sidebar-btn:hover { background: var(--surface-raised); color: var(--foreground); }
  .sidebar-btn.active { background-image: var(--gradient-brand); color: var(--accent-foreground); }

  .settings-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; max-width: 280px; }
  .settings-input {
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface-raised);
    padding: 8px 10px;
    color: var(--foreground);
    outline: none;
    font-size: 14px;
  }
  .settings-input:focus { border-color: var(--accent); }
  .settings-path { font-size: 12px; color: var(--muted); word-break: break-all; margin: 0 0 8px 0; }
  .field-label { font-size: 13px; color: var(--muted); }

  .account-skin-row { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
  .account-skin-row .skin-face-wrap { width: 72px; height: 72px; }
  .account-variant-row { display: flex; gap: 16px; font-size: 13px; color: var(--foreground); margin-bottom: 4px; }
  .account-variant-row label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .account-list-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .account-list-row-name { display: flex; align-items: center; gap: 10px; font-size: 13.5px; }
  .account-list-row-actions { display: flex; gap: 8px; }
  .account-list-row-actions button { font-size: 12px; padding: 5px 10px; }
  .account-active-tag {
    font-size: 11px;
    color: var(--accent-2);
    border: 1px solid var(--accent-2);
    border-radius: 999px;
    padding: 1px 8px;
  }

  .logo { font-weight: 700; font-size: 18px; letter-spacing: -0.02em; }
  .logo span {
    background-image: var(--gradient-brand);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  button.ms-login {
    background: var(--surface-raised);
    color: var(--foreground);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  button.ms-login:hover { border-color: var(--accent); }
  button.ms-login:disabled { color: var(--muted); cursor: default; }
  .ms-pending { color: var(--muted); }
  .ms-error { color: var(--danger); }

  /* Bouton compte dans la barre latérale (sous les paramètres) : icône
     seule comme le reste de la sidebar — la tête du skin du joueur sert
     d'avatar plutôt que d'afficher son pseudo en texte, trop large pour une
     barre de 56px. */
  .account-menu { position: relative; }
  .account-trigger {
    position: relative;
    width: 38px;
    height: 38px;
    padding: 0;
    border: none;
    border-radius: 10px;
    background: none;
    cursor: pointer;
    overflow: visible;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .account-trigger:hover { background: var(--surface-raised); }
  .account-trigger .status-dot.online {
    position: absolute;
    right: -2px;
    bottom: -2px;
    border: 2px solid var(--background);
  }
  .account-dropdown {
    position: absolute;
    left: calc(100% + 10px);
    bottom: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    min-width: 160px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    z-index: 10;
  }
  .skin-face-wrap, .mini-skin-face-wrap {
    position: relative;
    border-radius: 6px;
    overflow: hidden;
    background: var(--surface-raised);
  }
  .skin-face-wrap { width: 64px; height: 64px; border: 1px solid var(--border); }
  .mini-skin-face-wrap { width: 32px; height: 32px; border-radius: 8px; }
  .skin-face, .skin-face-overlay, .mini-skin-face, .mini-skin-face-overlay {
    position: absolute;
    inset: 0;
    background-repeat: no-repeat;
    image-rendering: pixelated;
  }
  .skin-face, .skin-face-overlay { background-size: 512px 512px; }
  .skin-face { background-position: -64px -64px; }
  .skin-face-overlay { background-position: -320px -64px; }
  .mini-skin-face, .mini-skin-face-overlay { background-size: 256px 256px; }
  .mini-skin-face { background-position: -32px -32px; }
  .mini-skin-face-overlay { background-position: -160px -32px; }
  .account-dropdown-name { font-size: 14px; font-weight: 600; }
  .account-dropdown-note { margin: 0; font-size: 12px; text-align: center; }
  .account-dropdown-signout { width: 100%; }

  main {
    flex: 1 1 auto;
    min-width: 0;
    overflow-y: auto;
    padding: 20px;
  }

  #status { color: var(--muted); font-size: 14px; margin-bottom: 12px; }
  #status.error { color: var(--danger); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 14px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .card:hover {
    border-color: var(--accent);
    transform: translateY(-3px);
    box-shadow: 0 12px 32px -12px rgba(34, 211, 238, 0.45);
  }

  .banner {
    height: 110px;
    background-image:
      radial-gradient(circle at 20% 15%, rgba(34, 211, 238, 0.35), transparent 55%),
      radial-gradient(circle at 85% 85%, rgba(45, 216, 138, 0.28), transparent 55%),
      var(--surface-raised);
    display: flex;
    align-items: flex-end;
    position: relative;
  }
  .banner img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .banner-scrim {
    position: relative;
    z-index: 1;
    width: 100%;
    padding: 24px 12px 10px;
    background-image: linear-gradient(to top, rgba(7, 12, 22, 0.85), transparent);
    font-weight: 700;
    font-size: 14px;
    color: var(--foreground);
  }

  .badge {
    position: absolute;
    top: 8px;
    right: 8px;
    z-index: 2;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    background: rgba(15, 23, 41, 0.8);
    backdrop-filter: blur(4px);
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .badge.modded { background-image: var(--gradient-brand); color: var(--accent-foreground); border: none; }

  .server-icon {
    flex: 0 0 auto;
    width: 26px;
    height: 26px;
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    background-image: var(--gradient-brand);
    color: var(--accent-foreground);
    font-weight: 700;
    font-size: 12px;
  }

  .card-body { padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
  .card-title-row { display: flex; align-items: center; gap: 8px; }
  .card-body h3 { margin: 0; font-size: 15px; }
  .card-body p { margin: 0; font-size: 12.5px; color: var(--muted); line-height: 1.4; max-height: 2.8em; overflow: hidden; }
  .players {
    margin-top: auto;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--foreground);
    display: flex;
    align-items: center;
  }
  .status-dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: var(--muted); flex: 0 0 auto; vertical-align: middle; margin-right: 6px;
  }
  .status-dot.online { background: var(--success); box-shadow: 0 0 6px rgba(45, 216, 138, 0.8); }

  .detail { max-width: 640px; }
  .detail button.back {
    background: none; border: none; color: var(--muted); cursor: pointer; font-size: 13px; padding: 0 0 16px 0;
  }
  .detail-banner {
    position: relative;
    height: 150px;
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 36px;
    background-image:
      radial-gradient(circle at 20% 15%, rgba(34, 211, 238, 0.35), transparent 55%),
      radial-gradient(circle at 85% 85%, rgba(45, 216, 138, 0.28), transparent 55%),
      var(--surface-raised);
  }
  .detail-banner img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .detail-icon {
    position: absolute;
    left: 20px;
    bottom: -22px;
    width: 56px;
    height: 56px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    background-image: var(--gradient-brand);
    color: var(--accent-foreground);
    font-weight: 700;
    font-size: 22px;
    border: 3px solid var(--background);
  }
  .detail-header { padding-left: 88px; min-height: 34px; }
  .detail h2 { margin: 0 0 4px 0; }
  .detail .meta { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .detail .desc { line-height: 1.6; margin-bottom: 20px; }

  .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .stat-tile {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 12px;
  }
  .stat-tile .stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
  .stat-tile .stat-value { margin-top: 2px; font-size: 14px; font-weight: 600; color: var(--foreground); }

  .tag-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
  .tag-chip {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--surface-raised);
    border: 1px solid var(--border);
    color: var(--foreground);
  }

  .join-btn {
    background: var(--accent-2);
    color: var(--accent-foreground);
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 8px 24px -8px rgba(45, 216, 138, 0.55);
    transition: filter 0.15s ease, transform 0.15s ease;
  }
  .join-btn:hover:not(:disabled) { filter: brightness(1.08); transform: translateY(-1px); }
  .join-btn:disabled { cursor: not-allowed; opacity: 0.6; }
  .join-note { margin-top: 8px; font-size: 12px; color: var(--muted); }

  #gate {
    position: relative;
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px;
    gap: 18px;
  }
  #gate::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(45% 40% at 30% 20%, rgba(34, 211, 238, 0.22), transparent 70%),
      radial-gradient(40% 35% at 75% 15%, rgba(45, 216, 138, 0.16), transparent 70%);
    pointer-events: none;
  }
  #gate > * { position: relative; }
  #gate .logo { font-size: 26px; }
  #gate-login {
    background-image: var(--gradient-brand);
    color: var(--accent-foreground);
    border: none;
    font-weight: 600;
    box-shadow: 0 8px 24px -8px rgba(34, 211, 238, 0.55);
    transition: filter 0.15s ease, transform 0.15s ease;
  }
  #gate-login:hover:not(:disabled) { filter: brightness(1.08); transform: translateY(-1px); }
  #gate p.tagline { color: var(--muted); font-size: 14px; margin: 0; max-width: 360px; }
  .gate-remember {
    display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted);
  }
  .gate-message { font-size: 13px; max-width: 360px; }

  .mc-status-menu { position: relative; -webkit-app-region: no-drag; margin-right: 8px; }
  .mc-status-trigger {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--surface-raised);
    color: var(--foreground);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 5px 12px 5px 10px;
    font-size: 12px;
    cursor: pointer;
  }
  .mc-status-trigger:hover { border-color: var(--accent); }
  .mc-status-trigger .status-dot { margin: 0; }
  .mc-status-panel {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px;
    min-width: 230px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    z-index: 20;
  }
  .mc-status-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 7px 6px;
    font-size: 12.5px;
  }
  .mc-status-row-label { display: flex; align-items: center; }
  .mc-status-row-label .status-dot { margin-right: 8px; }
  .mc-status-row-latency { color: var(--muted); font-size: 11px; }
  .status-dot.degraded { background: #f5b942; box-shadow: 0 0 6px rgba(245, 185, 66, 0.8); }
  .status-dot.offline { background: var(--danger); box-shadow: 0 0 6px rgba(255, 107, 129, 0.8); }
</style>
</head>
<body>
  <div id="titlebar">
    <div id="titlebar-drag">
      <div class="logo">Omniscient <span>Launcher</span></div>
    </div>
    <div class="mc-status-menu">
      <button class="mc-status-trigger" id="mc-status-trigger" type="button">
        <span class="status-dot" id="mc-status-dot"></span>
        Minecraft Status
      </button>
      <div class="mc-status-panel" id="mc-status-panel" hidden>
        <div id="mc-status-list"></div>
      </div>
    </div>
    <div id="titlebar-controls">
      <button id="win-min" class="titlebar-btn" title="Réduire" aria-label="Réduire">
        <svg viewBox="0 0 10 10"><rect x="0" y="4.5" width="10" height="1" fill="currentColor" /></svg>
      </button>
      <button id="win-max" class="titlebar-btn" title="Agrandir" aria-label="Agrandir">
        <svg viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor" /></svg>
      </button>
      <button id="win-close" class="titlebar-btn titlebar-btn-close" title="Fermer" aria-label="Fermer">
        <svg viewBox="0 0 10 10">
          <line x1="0" y1="0" x2="10" y2="10" stroke="currentColor" />
          <line x1="10" y1="0" x2="0" y2="10" stroke="currentColor" />
        </svg>
      </button>
    </div>
  </div>

  <div id="gate" hidden>
    <div class="logo" style="font-size: 26px;">Omniscient <span>Launcher</span></div>
    <p class="tagline">Connecte-toi avec ton compte Microsoft pour voir les serveurs et jouer.</p>
    <button id="gate-login" class="ms-login" style="padding: 10px 20px; font-size: 14px;">Se connecter avec Microsoft</button>
    <label class="gate-remember">
      <input type="checkbox" id="gate-remember" checked />
      Se souvenir de moi
    </label>
    <p class="gate-message" id="gate-message"></p>
  </div>

  <div id="app" hidden style="flex: 1 1 auto; display: flex; min-height: 0;">
    <nav id="sidebar">
      <button id="nav-servers" class="sidebar-btn active" title="Serveurs" aria-label="Serveurs">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" /><rect x="14" y="3" width="7" height="7" />
          <rect x="14" y="14" width="7" height="7" /><rect x="3" y="14" width="7" height="7" />
        </svg>
      </button>
      <button id="nav-settings" class="sidebar-btn" title="Paramètres" aria-label="Paramètres" style="margin-top: auto;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3" />
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
        </svg>
      </button>
      <div id="ms-account"></div>
    </nav>
    <main>
      <div id="status">Chargement des serveurs…</div>
      <div id="list" class="grid" hidden></div>
      <div id="detail" class="detail" hidden></div>
      <div id="settings-panel" class="detail" hidden>
        <h2>Paramètres</h2>

        <div class="stat-row" style="margin-top: 16px; max-width: 280px;">
          <div class="stat-tile">
            <div class="stat-label">Version</div>
            <div class="stat-value" id="settings-version">—</div>
          </div>
        </div>

        <div class="settings-field">
          <label for="settings-mem-min" class="field-label">Mémoire minimale (Go)</label>
          <input type="number" id="settings-mem-min" min="1" max="32" class="settings-input" />
        </div>
        <div class="settings-field">
          <label for="settings-mem-max" class="field-label">Mémoire maximale (Go)</label>
          <input type="number" id="settings-mem-max" min="1" max="32" class="settings-input" />
        </div>
        <button id="settings-save" class="join-btn">Enregistrer</button>
        <p class="join-note" id="settings-status"></p>

        <div class="settings-field" style="margin-top: 24px;">
          <span class="field-label">Dossier du jeu</span>
          <p class="settings-path" id="settings-game-root"></p>
          <button id="settings-open-folder" class="ms-login">Ouvrir le dossier</button>
        </div>
      </div>
      <div id="account-panel" class="detail" hidden></div>
    </main>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
